_base_: ../base.yaml
name: ese_qwen3_0.6b
method: ese
model:
  name_or_path: Qwen/Qwen3-Embedding-0.6B
  hidden_dim: 1024
  # ESE pools with the attention-masked mean, in the loss and at eval time.
  pooling: mean
  trust_remote_code: true
matryoshka:
  dims: [16, 32, 64, 128, 256, 512, 1024]
ese:
  # tau is shared with the other methods (matryoshka.temperature).
  temperature: 0.05
  n_layers_per_step: 1
  use_intermediate_layers: true
  use_layer_weight: true
train:
  output_dir: outputs/ese_qwen3_0.6b
