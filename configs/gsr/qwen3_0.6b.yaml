_base_: ../base.yaml
name: gsr_qwen3_0.6b
method: gsr
model:
  name_or_path: Qwen/Qwen3-Embedding-0.6B
  hidden_dim: 1024
  pooling: cls
  trust_remote_code: true
matryoshka:
  dims: [16, 32, 64, 128, 256, 512, 1024]
gsr:
  weight: 1.0
  warmup_epochs: 1
  refresh_every_epochs: 1
  teacher_batch_size: 64
  geometry_dims: [16, 32, 64, 128, 256, 512, 1024]
  eigengap_tolerance: 1.0e-6
  merge_tied_shells: true
  diagnostics_every_steps: 100
  diagnostic_samples: 512
  diagnostic_pairs: 8192
  save_teacher_tensors: true
train:
  output_dir: outputs/gsr_qwen3_0.6b
