_base_: ../base.yaml
name: gsr_tinybert_6l
method: gsr
model:
  name_or_path: huawei-noah/TinyBERT_General_6L_768D
  hidden_dim: 768
  pooling: cls
  trust_remote_code: false
matryoshka:
  dims: [16, 32, 64, 128, 256, 512, 768]
gsr:
  weight: 1.0
  warmup_epochs: 1
  refresh_every_epochs: 1
  teacher_batch_size: 64
  geometry_dims: [16, 32, 64, 128, 256, 512, 768]
  eigengap_tolerance: 1.0e-6
  merge_tied_shells: true
  diagnostics_every_steps: 100
  diagnostic_samples: 512
  diagnostic_pairs: 8192
  save_teacher_tensors: true
train:
  output_dir: outputs/gsr_tinybert_6l
