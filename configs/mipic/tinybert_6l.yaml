_base_: ../base.yaml
name: mipic_tinybert_6l
method: mipic
model:
  name_or_path: huawei-noah/TinyBERT_General_6L_768D
  hidden_dim: 768
  pooling: cls
matryoshka:
  dims: [16, 32, 64, 128, 256, 512, 768]
mipic:
  align_layers: [2, 4]             # 6-layer TinyBERT
  pipeline_pairs: [[1, 16, 3, 128, 5, 768]]
  alpha: 0.4
  beta: 0.4
  gamma: 0.2
  base_k: 64
  d_att: 64
  use_attention_kl: false
  module_lr_scale: 2.0
  w_align: 0.4
  w_matryoshka: 0.6
train:
  epochs: 8
  max_grad_norm: 1.0
  output_dir: outputs/mipic_tinybert_6l
