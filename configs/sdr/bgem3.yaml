_base_: ../base.yaml
name: sdr_bgem3
method: sdr
model:
  name_or_path: BAAI/bge-m3
  hidden_dim: 1024
  pooling: cls
  trust_remote_code: false
matryoshka:
  dims: [16, 32, 64, 128, 256, 512, 1024]
sdr:
  # Sec 10.1 (Eq 123-128): the minimal proposed model.
  lambda_sem: 1.0            # Eq 127 searches {0.1, 0.3, 1.0}
  # Eq 56 pins lambda_mono to 0 in the minimal model, and Sec 4.11 keeps the
  # regulariser only if it earns its place. Two reasons to leave it off here:
  #   1. Sec 8.1's go/no-go compares L_MRL against L_MRL + lambda_sem*L_sem.
  #      Switching on a second new term at the same time confounds that answer.
  #   2. The term is a hinge, sum_k [D_k - D_(k-1)]_+ (Eq 54). Prop 2 says the
  #      *optimal* decoder is already monotone, so if the practical cosine
  #      decoder never violates it the hinge is identically 0 and contributes
  #      no gradient - the weight would be meaningless either way.
  # Decide from measurement, not from a guess: set sdr.diagnostics_every and
  # read V_mono (Eq 108) from the log. V_mono = 0 -> leave this at 0. Otherwise
  # sweep Eq 107's {0.05, 0.1, 0.3}, starting at 0.05: L_sem is a pi-weighted
  # *average* of the D_k while L_mono is a *sum* over K-2 edges, so 0.3 already
  # makes the two terms comparable in magnitude once violations are real.
  lambda_mono: 0.1
  teacher_temperature: 0.05   # tau_T, Eq 125
  student_temperature: 0.05   # tau_S, Eq 126
  divergence: forward_kl
  geometry: snd
  candidates: all             # all in-batch references, Sec 10.1
  rate_prior: uniform         # pi_k = 1/(K-1), Eq 49
  stochastic_rate: false
  teacher: online
train:
  max_grad_norm: 1.0
  output_dir: outputs/sdr_bgem3
eval:
  # Sec 6: report the distortion-rate profile next to task quality.
  semantic_distortion: true
