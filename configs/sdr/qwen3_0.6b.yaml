_base_: ../base.yaml
name: sdr_qwen3_0.6b
method: sdr
model:
  name_or_path: Qwen/Qwen3-Embedding-0.6B
  hidden_dim: 1024
  pooling: cls
  trust_remote_code: true
matryoshka:
  dims: [16, 32, 64, 128, 256, 512, 1024]
sdr:
  # Sec 10.1 (Eq 123-128): the minimal proposed model, L_MRL + lambda_sem * L_sem.
  # L_sem is a pi-weighted *average* of K-1 distortions while L_task is a *sum*
  # of K InfoNCE terms, so lambda_sem = 1 gives the semantic term roughly 1/K
  # of the task gradient. Sweep {1, 3, 10}.
  lambda_sem: 1.0
  # Eq 56 pins lambda_mono to 0 in the minimal model: Sec 8.1's go/no-go is
  # L_MRL against L_MRL + lambda_sem * L_sem, and a second new term would
  # confound it. Decide from measurement: set sdr.diagnostics_every, read
  # V_mono (Eq 108). V_mono = 0 -> leave at 0; otherwise sweep {0.05, 0.1, 0.3}.
  # The hinge is [D_k - sg(D_(k-1))]_+ so it can never lower the penalty by
  # degrading the smaller prefix.
  lambda_mono: 0.0
  teacher_temperature: 0.05   # tau_T, Eq 125
  # Eq 24: one decoder temperature tau_k per truncated prefix, initialised at
  # tau_T and learned. The optimal decoder p_T(S | Z_k) is flatter than
  # p_T(S | X), so tying tau_k = tau_T inflates epsilon_k at low rates; the
  # full width keeps tau_K = tau_T and D_K = 0 by construction.
  student_temperature: 0.05
  learnable_temperature: true
  temperature_lr: 0.01
  divergence: forward_kl
  geometry: snd
  candidates: all             # every in-batch + queued reference, Sec 4.2
  # Sec 4.2: with batch 16 the semantic variable has at most log(15) = 2.7
  # nats and most anchors have no genuine neighbour in the batch. The queue
  # keeps the last 4096 full-width embeddings as extra candidates so p_T can
  # peak on real neighbours. 0 restores the batch-only estimator.
  queue_size: 4096
  rate_prior: uniform         # pi_k = 1/(K-1), Eq 49
  stochastic_rate: false
  # A3. 'online' is the paper's default, but note Sec 4.9: with a self-teacher
  # p_T moves with the student and D_k = 0 is also reached by the tail
  # coordinates going inert. Watch norm_share in the diagnostics; 'ema' or
  # 'frozen' removes the degeneracy at the cost of a second forward pass.
  teacher: online
  diagnostics_every: 200
train:
  max_grad_norm: 1.0
  output_dir: outputs/sdr_qwen3_0.6b
eval:
  # Sec 6: report the distortion-rate profile next to task quality. Set
  # eval.reference_model to hold the teacher fixed across compared models.
  semantic_distortion: true
